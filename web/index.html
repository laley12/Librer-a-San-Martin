<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Panel administrativo de Librería San Martín" />
<title>Librería San Martín · Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icono.svg" type="image/svg+xml" />
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'Segoe UI', 'sans-serif'] } } } };
</script>
<style>
  html, body { height: 100%; }
  body { font-family: Inter, "Segoe UI", sans-serif; }
  .scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  .fade { animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
  @media print { aside, header, footer { display: none !important; } }
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<!-- LOGIN (generado por app.js) -->
<div id="login" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-[#1e3c72] via-[#2a5298] to-[#1e3c72]"></div>

<!-- APP -->
<div id="app" class="hidden min-h-screen flex">
  <aside class="w-64 bg-[#1e3c72] text-white flex flex-col shrink-0">
    <div class="px-5 py-5 border-b border-white/10 flex items-center gap-3">
      <span class="text-2xl">📚</span>
      <div>
        <div class="font-bold leading-tight">Librería San Martín</div>
        <div class="text-[11px] text-blue-200">Panel de escritorio</div>
      </div>
    </div>
    <nav id="nav" class="flex-1 p-3 space-y-1 overflow-y-auto scroll"></nav>
    <div class="p-4 border-t border-white/10 text-xs text-blue-200 space-y-1">
      <div class="flex items-center gap-2">
        <span id="dotRT" class="w-2 h-2 rounded-full bg-slate-400"></span>
        <span id="txtRT">Conectando Realtime…</span>
      </div>
      <div>PostgreSQL · Supabase</div>
      <a href="/movil.html" class="block pt-1 underline text-blue-100">📱 Versión móvil / PWA →</a>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-10">
      <div>
        <h1 id="titulo" class="text-lg font-bold text-[#1e3c72]">Dashboard General</h1>
        <p id="subtitulo" class="text-xs text-slate-500">Resumen general de la librería</p>
      </div>
      <div class="flex items-center gap-4">
        <div id="cargando" class="hidden text-xs text-slate-400 animate-pulse">Sincronizando…</div>
        <div class="text-right">
          <div id="nombreUsuario" class="text-sm font-semibold text-slate-700">—</div>
          <div id="rolUsuario" class="text-xs text-slate-500">—</div>
        </div>
        <div id="avatar" class="w-10 h-10 rounded-full bg-[#1e3c72] text-white grid place-items-center font-bold">LS</div>
        <button id="btnSalir" class="text-xs text-slate-500 hover:text-red-600 border border-slate-300 rounded-lg px-3 py-2">Salir</button>
      </div>
    </header>

    <main id="vista" class="flex-1 p-6 overflow-y-auto scroll"></main>

    <footer class="px-6 py-2 text-[11px] text-slate-400 border-t border-slate-200 flex justify-between">
      <span>Última carga: <span id="ultimaCarga">—</span></span>
      <span>RLS activo · Realtime en ventas, inventario, compras y clientes</span>
    </footer>
  </div>
</div>

<script type="module">
  import { iniciar, cablearGlobal, registrarSW } from "/assets/app.js";
  cablearGlobal();
  iniciar("desktop");
  registrarSW();
</script>
</body>
</html>
